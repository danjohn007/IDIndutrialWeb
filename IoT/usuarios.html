<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#12161B">
    <title>ID Industrial | Usuarios</title>
    <link rel="stylesheet" href="css/usuarios.css?v=20260729-users1">
    <link rel="stylesheet" href="css/motion.css?v=20260804-motion1">
  </head>
  <body>
    <main class="users-shell">
      <header class="users-topbar">
        <a class="brand-lockup" href="index.html" aria-label="Volver al panel">
          <img src="assets/logo-id-industrial.png" alt="ID Industrial">
          <span>
            <small>Panel industrial</small>
            <strong>Administracion de usuarios</strong>
          </span>
        </a>
        <div class="topbar-actions">
          <span class="session-user">
            <strong id="sessionUserName">Verificando...</strong>
            <small id="sessionUserRole">--</small>
          </span>
          <a class="button button-secondary" href="dispositivos.html">Dispositivos</a>
          <a class="button button-secondary" href="index.html">Volver al panel</a>
          <button class="icon-button" id="logoutButton" type="button" aria-label="Cerrar sesion" title="Cerrar sesion">Salir</button>
        </div>
      </header>

      <section class="users-panel">
        <div class="panel-heading">
          <div>
            <p class="section-label">Administracion</p>
            <h1>Usuarios del panel</h1>
            <p class="panel-description">Crea cuentas, asigna permisos y controla el acceso de tu equipo.</p>
          </div>
          <button class="button button-primary" id="newUserButton" type="button">Nuevo usuario</button>
        </div>
        <p class="form-message" id="pageMessage" aria-live="polite"></p>
        <div class="users-summary" id="usersSummary">Cargando usuarios...</div>
        <div class="table-wrap">
          <table class="users-table">
            <thead>
              <tr>
                <th>Usuario</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Ultimo acceso</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="usersTable"></tbody>
          </table>
        </div>
      </section>
    </main>

    <dialog class="user-dialog" id="userDialog" aria-labelledby="userDialogTitle">
      <form class="user-form" id="userForm" method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="section-label">Cuenta de acceso</p>
            <h2 id="userDialogTitle">Nuevo usuario</h2>
          </div>
          <button class="dialog-close" id="dialogClose" type="button" aria-label="Cerrar">X</button>
        </div>
        <input id="userId" type="hidden">
        <label class="form-field">
          <span>Nombre</span>
          <input id="userName" type="text" minlength="2" maxlength="100" autocomplete="name" required>
        </label>
        <label class="form-field">
          <span>Correo</span>
          <input id="userEmail" type="email" maxlength="160" autocomplete="email" required>
        </label>
        <div class="form-grid">
          <label class="form-field">
            <span>Rol</span>
            <select id="userRole">
              <option value="ADMIN">Administrador</option>
              <option value="OPERADOR">Operador</option>
              <option value="LECTURA">Solo lectura</option>
            </select>
          </label>
          <label class="form-field">
            <span>Estado</span>
            <select id="userStatus">
              <option value="ACTIVO">Activo</option>
              <option value="BLOQUEADO">Bloqueado</option>
              <option value="INACTIVO">Inactivo</option>
            </select>
          </label>
        </div>
        <label class="form-field">
          <span id="passwordLabel">Contraseña</span>
          <input id="userPassword" type="password" minlength="8" maxlength="200" autocomplete="new-password">
          <small id="passwordHelp">Minimo 8 caracteres, con mayuscula, minuscula y numero.</small>
        </label>
        <p class="form-message" id="dialogMessage" aria-live="polite"></p>
        <div class="dialog-actions">
          <button class="button button-secondary" id="dialogCancel" type="button">Cancelar</button>
          <button class="button button-primary" id="dialogSubmit" type="submit">Guardar usuario</button>
        </div>
      </form>
    </dialog>
    <script src="js/motion.js?v=20260804-motion1" defer></script>
    <script src="js/usuarios.js" defer></script>
  </body>
</html>
